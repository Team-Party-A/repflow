<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>iPhone 今天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:'Barlow Condensed','SF Pro Display',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#FFFFFF;border-radius:18px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EE; color: #121212; font-family: 'PingFang SC', -apple-system, 'Hiragino Sans GB', sans-serif; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div>
      <div style="font-size: 13px; font-weight: 600; color: #5E5D57">10月19日 周一</div>
      <div style="font-size: 34px; font-weight: 700; margin-top: 2px">今天</div>
    </div>

    <div style="background: #121212; color: #F2F1EA; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="font-size: 13px; color: #9D9C94">近 7 天</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div><div class="n" style="font-size: 44px">3</div><div style="font-size: 13px; color: #9D9C94; margin-top: 4px">次训练</div></div>
        <div><div class="n" style="font-size: 44px">12</div><div style="font-size: 13px; color: #9D9C94; margin-top: 4px">组</div></div>
        <div><div class="n" style="font-size: 44px; color: #D4FF3A">114</div><div style="font-size: 13px; color: #9D9C94; margin-top: 4px">动作总次数</div></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 56px">
        <div style="height: 4px; border-radius: 2px; background: #2A2B2E"></div>
        <div style="height: 4px; border-radius: 2px; background: #2A2B2E"></div>
        <div style="height: 4px; border-radius: 2px; background: #2A2B2E"></div>
        <div style="height: 34px; border-radius: 6px; background: #4A4B4F"></div>
        <div style="height: 4px; border-radius: 2px; background: #2A2B2E"></div>
        <div style="height: 56px; border-radius: 6px; background: #4A4B4F"></div>
        <div style="height: 32px; border-radius: 6px; background: #D4FF3A"></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; font-size: 12px; color: #9D9C94; text-align: center; margin-top: -8px">
        <span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span><span style="color: #F2F1EA; font-weight: 600">今天</span>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px">
      <div style="font-size: 20px; font-weight: 700">最近训练</div>
      <a href="ui-phone-history.html" style="font-size: 15px; color: #5E5D57; text-decoration: none">全部</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="ui-phone-detail.html" class="row" style="text-decoration: none; color: #121212">
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 17px; font-weight: 600">哑铃弯举 · 哑铃肩推</div>
          <div style="font-size: 13px; color: #5E5D57; margin-top: 3px">今天 18:30 · 3 组 · 30 次</div>
        </div>
        <div class="chip" style="background: #FFF1D6; color: #8A5300"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>待同步</div>
      </a>
      <div class="row">
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 17px; font-weight: 600">深蹲 · 卧推</div>
          <div style="font-size: 13px; color: #5E5D57; margin-top: 3px">昨天 19:05 · 5 组 · 52 次</div>
        </div>
        <div class="chip" style="background: #ECEBE4; color: #5E5D57"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>已同步</div>
      </div>
      <div class="row">
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 17px; font-weight: 600">引体向上</div>
          <div style="font-size: 13px; color: #5E5D57; margin-top: 3px">10月16日 20:10 · 4 组 · 32 次</div>
        </div>
        <div class="chip" style="background: #FDE5E2; color: #B8261A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></svg>同步失败</div>
      </div>
    </div>

    <button style="height: 50px; border: 1.5px dashed #B9B8B0; border-radius: 18px; background: transparent; color: #121212; font: 600 16px 'PingFang SC', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>手动记录一次训练</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 32px 0; background: #FBFAF6; border-top: 1px solid #E2E1DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #121212; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>今天</div>
    <a href="ui-phone-history.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5E5D57; font-size: 11px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>历史</a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5E5D57; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>设置</div>
  </div>
</div>
</body>
</html>
