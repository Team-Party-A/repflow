<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>iPhone 历史与统计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:'Barlow Condensed','SF Pro Display',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px 13px 16px;background:#1A1B1D;border-radius:18px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:#2A2B2E;font-size:13px;font-weight:600;white-space:nowrap}
.h{font-size:13px;font-weight:600;color:#9D9C94;margin:2px 0 -4px 4px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0C; color: #F2F1EA; font-family: 'PingFang SC', -apple-system, 'Hiragino Sans GB', sans-serif; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 34px; font-weight: 700">历史</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: #2A2B2E">
      <button style="height: 34px; border: 0; border-radius: 9px; background: #F2F1EA; color: #121212; font: 600 14px 'PingFang SC', -apple-system, sans-serif">近 7 天</button>
      <button style="height: 34px; border: 0; border-radius: 9px; background: transparent; color: #F2F1EA; font: 500 14px 'PingFang SC', -apple-system, sans-serif">近 30 天</button>
    </div>

    <div style="background: #1A1B1D; border-radius: 22px; padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div><div class="n" style="font-size: 34px">3</div><div style="font-size: 13px; color: #9D9C94; margin-top: 3px">次训练</div></div>
        <div><div class="n" style="font-size: 34px">12</div><div style="font-size: 13px; color: #9D9C94; margin-top: 3px">组</div></div>
        <div><div class="n" style="font-size: 34px">114</div><div style="font-size: 13px; color: #9D9C94; margin-top: 3px">动作总次数</div></div>
      </div>
      <div style="font-size: 13px; color: #9D9C94; border-top: 1px solid #2A2B2E; padding-top: 12px">每日动作总次数</div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end; height: 76px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="width: 100%; height: 4px; border-radius: 2px; background: #2A2B2E"></div></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="width: 100%; height: 4px; border-radius: 2px; background: #2A2B2E"></div></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="width: 100%; height: 4px; border-radius: 2px; background: #2A2B2E"></div></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span class="n" style="font-size: 15px; color: #9D9C94">32</span><div style="width: 100%; height: 38px; border-radius: 6px; background: #4A4B4F"></div></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="width: 100%; height: 4px; border-radius: 2px; background: #2A2B2E"></div></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span class="n" style="font-size: 15px; color: #9D9C94">52</span><div style="width: 100%; height: 62px; border-radius: 6px; background: #4A4B4F"></div></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span class="n" style="font-size: 15px; color: #D4FF3A">30</span><div style="width: 100%; height: 36px; border-radius: 6px; background: #D4FF3A"></div></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; font-size: 12px; color: #9D9C94; text-align: center">
        <span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span><span style="color: #F2F1EA; font-weight: 600">今天</span>
      </div>
    </div>

    <div class="h">今天</div>
    <a href="ui-phone-detail.html" class="row" style="text-decoration: none; color: #F2F1EA">
      <div style="flex-grow: 1; min-width: 0"><div style="font-size: 17px; font-weight: 600">哑铃弯举 · 哑铃肩推</div><div style="font-size: 13px; color: #9D9C94; margin-top: 3px">18:30 · 3 组 · 30 次</div></div>
      <div class="chip" style="color: #FFB547"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>待同步</div>
    </a>
    <div class="h">昨天</div>
    <div class="row">
      <div style="flex-grow: 1; min-width: 0"><div style="font-size: 17px; font-weight: 600">深蹲 · 卧推</div><div style="font-size: 13px; color: #9D9C94; margin-top: 3px">19:05 · 5 组 · 52 次</div></div>
      <div class="chip" style="color: #9D9C94"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>已同步</div>
    </div>
    <div class="h">10月16日 周五</div>
    <div class="row">
      <div style="flex-grow: 1; min-width: 0"><div style="font-size: 17px; font-weight: 600">引体向上</div><div style="font-size: 13px; color: #FF6B5B; margin-top: 3px">同步失败 · 本地记录已保留</div></div>
      <button style="height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: #2A2B2E; color: #F2F1EA; font: 600 14px 'PingFang SC', -apple-system, sans-serif; display: flex; align-items: center; gap: 5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>重试</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 32px 0; background: #141416; border-top: 1px solid #2A2B2E; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="ui-phone-today.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #9D9C94; font-size: 11px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>今天</a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #F2F1EA; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>历史</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #9D9C94; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>设置</div>
  </div>
</div>
</body>
</html>
