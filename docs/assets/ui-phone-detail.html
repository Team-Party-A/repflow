<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>iPhone 训练详情</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:'Barlow Condensed','SF Pro Display',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.set{display:grid;grid-template-columns:28px 76px minmax(0,1fr) 44px;align-items:center;gap:10px;padding:10px 8px 10px 16px}
.idx{width:28px;height:28px;border-radius:14px;background:#ECEBE4;font-size:13px;font-weight:600;color:#5E5D57;display:flex;align-items:center;justify-content:center}
.edit{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:#5E5D57;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EE; color: #121212; font-family: 'PingFang SC', -apple-system, 'Hiragino Sans GB', sans-serif; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <a href="ui-phone-today.html" style="display: flex; align-items: center; gap: 2px; height: 44px; margin-left: -8px; color: #121212; font-size: 17px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>今天</a>

  <div>
    <div style="font-size: 28px; font-weight: 700">10月19日 训练</div>
    <div style="font-size: 15px; color: #5E5D57; margin-top: 4px">18:30 – 19:12 · 42 分钟</div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #FFF1D6; color: #8A5300">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div style="flex-grow: 1">
      <div style="font-size: 15px; font-weight: 600">已保存到手机 · 待同步</div>
      <div style="font-size: 13px; margin-top: 2px">联网后自动上传，可以继续查看和修改</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px"><div class="n" style="font-size: 34px">2</div><div style="font-size: 13px; color: #5E5D57; margin-top: 2px">个动作</div></div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px"><div class="n" style="font-size: 34px">3</div><div style="font-size: 13px; color: #5E5D57; margin-top: 2px">组</div></div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px"><div class="n" style="font-size: 34px">30</div><div style="font-size: 13px; color: #5E5D57; margin-top: 2px">动作总次数</div></div>
  </div>

  <div style="font-size: 20px; font-weight: 700; margin-top: 6px">哑铃弯举</div>
  <div style="background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column">
    <div class="set">
      <div class="idx">1</div>
      <div style="display: flex; align-items: baseline; gap: 4px"><span class="n" style="font-size: 40px">8</span><span style="font-size: 15px; color: #5E5D57">次</span></div>
      <div><div style="font-size: 16px">10 kg</div><div style="font-size: 13px; color: #5E5D57; margin-top: 2px">自动</div></div>
      <button class="edit" aria-label="修正第 1 组"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
    </div>
    <div style="height: 1px; background: #ECEBE4; margin-left: 54px"></div>
    <div class="set">
      <div class="idx">2</div>
      <div style="display: flex; align-items: baseline; gap: 4px"><span class="n" style="font-size: 40px">10</span><span style="font-size: 15px; color: #5E5D57">次</span></div>
      <div><div style="font-size: 16px">10 kg</div><div style="font-size: 13px; color: #5E5D57; margin-top: 2px">自动 · 已修正（估计 9）</div></div>
      <button class="edit" aria-label="修正第 2 组"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
    </div>
  </div>

  <div style="font-size: 20px; font-weight: 700; margin-top: 6px">哑铃肩推</div>
  <div style="background: #FFFFFF; border-radius: 18px">
    <div class="set">
      <div class="idx">1</div>
      <div style="display: flex; align-items: baseline; gap: 4px"><span class="n" style="font-size: 40px">12</span><span style="font-size: 15px; color: #5E5D57">次</span></div>
      <div><div style="font-size: 16px; color: #5E5D57">重量未填写</div><div style="font-size: 13px; color: #5E5D57; margin-top: 2px">手动</div></div>
      <button class="edit" aria-label="修正第 1 组"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
    </div>
  </div>

  <button style="margin-top: 10px; height: 48px; border: 0; background: transparent; color: #B8261A; font: 600 16px 'PingFang SC', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>删除训练</button>
</div>
</body>
</html>
