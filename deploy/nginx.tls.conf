events {}
http {
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream backend_api {
        zone backend_api 64k;
        server api:8000 resolve;
    }
    server {
        listen 80;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 404; }
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/repflow-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/repflow-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
        location = /health {
            proxy_pass http://backend_api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location ~ "^/api/v1/(?:auth/(?:register|login|logout)|workouts(?:/[^/]+)?)$" {
            proxy_pass http://backend_api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
        location = /.well-known/repflow-tls-status {
            alias /var/www/tls-status/status.json;
            default_type application/json;
            add_header Cache-Control no-store always;
        }
        location ~ "^/[.]well-known/repflow-deploy/([0-9]+-[0-9]+)[.]json$" {
            alias /var/www/tls-status/deploy-$1.json;
            default_type application/json;
            add_header Cache-Control no-store always;
        }
        location / { return 404; }
    }
}
