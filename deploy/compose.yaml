name: repflow

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.30.6-trixie@sha256:a7675fcee220f59b4a99f7098c06a0d5d999c2c0ee37c0211efb780536e5cb20
    ports: ["${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped
    logging: *logging

  api:
    image: ${API_IMAGE:?Set API_IMAGE to the published image digest}
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-repflow}
      DB_USER: ${POSTGRES_USER:-repflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
    networks: [frontend, backend]
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repflow}
      POSTGRES_USER: ${POSTGRES_USER:-repflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]
    restart: unless-stopped
    logging: *logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
