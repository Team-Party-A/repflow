events {}
http {
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    server {
        listen 80;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
