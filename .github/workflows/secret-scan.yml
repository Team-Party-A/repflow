name: Secret scan

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install verified gitleaks CLI
        run: sh scripts/install-git-hooks.sh
      - name: Test native hook and historical detection
        run: sh scripts/test-git-hooks.sh
      - name: Scan current ancestry including intermediate and merge commits
        run: |
          common_dir=$(git rev-parse --git-common-dir)
          "$common_dir/repflow-tools/gitleaks/8.30.1/gitleaks" git \
            --config .gitleaks.toml --redact=100 --verbose \
            --log-opts="--full-history -m HEAD" .
