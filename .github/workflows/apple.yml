name: Apple

on:
  pull_request:
    paths: ["apps/apple/**", ".github/workflows/apple.yml"]
  push:
    branches: [dev, main]
    paths: ["apps/apple/**", ".github/workflows/apple.yml"]

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Apple checks
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned Xcode and record runner environment
        run: |
          actual_xcode=$(xcodebuild -version)
          printf '%s\n' "$actual_xcode"
          expected_xcode=$(printf 'Xcode 27.1\nBuild version 27A9275')
          if [ "$actual_xcode" != "$expected_xcode" ]; then
            printf 'Apple CI requires Xcode 27.1 (27A9275); review environment changes in a PR.\n' >&2
            exit 1
          fi
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          xcrun simctl list devices available
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive .
      - name: Build iOS app and embedded Watch app
        run: |
          xcodebuild build -project RepFlow.xcodeproj -scheme RepFlow \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/repflow-derived-data" CODE_SIGNING_ALLOWED=NO
      - name: Run iOS XCTest on iOS 27.0
        run: |
          xcodebuild test -project RepFlow.xcodeproj -scheme RepFlow \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -destination-timeout 120 -derivedDataPath "$RUNNER_TEMP/repflow-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/RepFlow-iOS.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Run watchOS XCTest on watchOS 27.0
        run: |
          xcodebuild test -project RepFlow.xcodeproj -scheme RepFlowWatch \
            -configuration Debug -destination 'platform=watchOS Simulator,name=Apple Watch SE 3 (40mm),OS=27.0' \
            -destination-timeout 120 -derivedDataPath "$RUNNER_TEMP/repflow-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/RepFlow-watchOS.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Summarize successful checks
        run: |
          {
            printf '### Apple CI\n\n'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf 'Xcode 27.1 (27A9275); iPhone 17 / iOS 27.0; Apple Watch SE 3 (40mm) / watchOS 27.0.\n\n'
            printf 'Passed: strict formatting, iOS app with embedded Watch app build, and both XCTest schemes.\n\n'
            printf 'Minimum-version physical-device validation remains separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"
