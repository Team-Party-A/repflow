name: Apple

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev, main]
    paths: ["apps/apple/**", ".github/workflows/apple.yml", "scripts/ci_scope.py", "scripts/test_ci_scope.py"]

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p test_ci_scope.py
      - id: scope
        run: python3 scripts/ci_scope.py apple

  checks:
    name: Apple checks
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned Xcode and record runner environment
        run: |
          actual_xcode=$(xcodebuild -version)
          printf '%s\n' "$actual_xcode"
          expected_xcode=$(printf 'Xcode 27.1\nBuild version 27A9275')
          if [ "$actual_xcode" != "$expected_xcode" ]; then
            printf 'Apple CI requires Xcode 27.1 (27A9275); review environment changes in a PR.\n' >&2
            exit 1
          fi
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          xcrun simctl list devices available
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive .
      - name: Build iOS app and embedded Watch app
        run: |
          xcodebuild build -project RepFlow.xcodeproj -scheme RepFlow \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/repflow-derived-data" CODE_SIGNING_ALLOWED=NO
      - name: Package the simulator App for PR 161 acceptance
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 161 && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # 模拟器通过链接时的 App 标识访问自己的钥匙串。无签名的测试宿主仅用于 XCTest。
          entitlements="$RUNNER_TEMP/repflow-161-simulator.entitlements"
          config="$RUNNER_TEMP/repflow-161-simulator.xcconfig"
          printf 'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*] = %s\n' "$entitlements" > "$config"
          /usr/libexec/PlistBuddy -c 'Add :application-identifier string SIM161TEST.$(PRODUCT_BUNDLE_IDENTIFIER)' "$entitlements"
          xcodebuild build -project RepFlow.xcodeproj -scheme RepFlow \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/repflow-derived-data" \
            -xcconfig "$config" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
          products="$RUNNER_TEMP/repflow-derived-data/Build/Products/Debug-iphonesimulator"
          info="$products/RepFlow.app/Info.plist"
          python3 - "$info" <<'PYTHON'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          if info["CFBundleSupportedPlatforms"] != ["iPhoneSimulator"] or info.get("RepFlowAPIBaseURL"):
              sys.exit("Expected a simulator App with an unconfigured API address")
          PYTHON
          # 检查模拟器使用的 Mach-O entitlement 段，避免上传只能打开登录页的包。
          executable="$products/RepFlow.app/RepFlow"
          xcrun otool -arch arm64 -l "$executable" > "$RUNNER_TEMP/repflow-load-commands.txt"
          grep -Fq 'sectname __entitlements' "$RUNNER_TEMP/repflow-load-commands.txt"
          /usr/bin/strings -arch arm64 "$executable" > "$RUNNER_TEMP/repflow-sim-strings.txt"
          grep -Fq 'SIM161TEST.io.github.teampartya.repflow' "$RUNNER_TEMP/repflow-sim-strings.txt"
          tar -czf "$RUNNER_TEMP/repflow-simulator.tar.gz" -C "$products" RepFlow.app
      - name: Retain the simulator App for one day
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 161 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repflow-simulator-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repflow-simulator.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Run iOS XCTest on iOS 27.0
        run: |
          xcodebuild test -project RepFlow.xcodeproj -scheme RepFlow \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -destination-timeout 120 -derivedDataPath "$RUNNER_TEMP/repflow-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/RepFlow-iOS.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Run watchOS XCTest on watchOS 27.2
        run: |
          xcodebuild test -project RepFlow.xcodeproj -scheme RepFlowWatch \
            -configuration Debug -destination 'platform=watchOS Simulator,name=Apple Watch SE 3 (40mm),OS=27.2' \
            -destination-timeout 120 -derivedDataPath "$RUNNER_TEMP/repflow-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/RepFlow-watchOS.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Summarize successful checks
        run: |
          {
            printf '### Apple CI\n\n'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf 'Xcode 27.1 (27A9275); iPhone 17 / iOS 27.0; Apple Watch SE 3 (40mm) / watchOS 27.2.\n\n'
            printf 'Passed: strict formatting, iOS app with embedded Watch app build, and both XCTest schemes.\n\n'
            printf 'Minimum-version physical-device validation remains separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Apple CI gate
    if: ${{ always() }}
    needs: [scope, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          case "$SCOPE/$REQUIRED/$CHECKS" in
            success/true/success) echo 'Apple checks passed.' ;;
            success/false/skipped) echo 'No Apple changes in the checked commit.' ;;
            *) echo 'Apple CI is incomplete or failed.' >&2; exit 1 ;;
          esac
